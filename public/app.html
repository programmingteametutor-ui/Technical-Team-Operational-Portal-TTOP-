<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Operations Portal</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root { --bg:#f6f7fb; --card:#fff; --line:#e3e6ee; --text:#18213a; --muted:#66708a; --brand:#1d4ed8; --brand2:#0b2b73; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:14px 24px; background:var(--brand2); color:#fff; }
  header h1 { font-size:16px; margin:0; font-weight:650; letter-spacing:.2px; }
  header .sp { flex:1; }
  header .who { font-size:13px; opacity:.9; }
  header button { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.35); }
  main { max-width:1080px; margin:0 auto; padding:28px 24px 60px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--text); cursor:pointer; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  button.danger { color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  .center { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .login { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:36px; max-width:420px; width:100%; text-align:center; box-shadow:0 10px 40px rgba(15,23,42,.06); }
  .login h1 { font-size:22px; margin:0 0 6px; }
  .login p { color:var(--muted); margin:0 0 22px; }
  .gbtn { display:inline-flex; align-items:center; gap:10px; padding:10px 18px; font-weight:600; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin:8px 0 28px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; display:flex; flex-direction:column; gap:10px; }
  .tile h2 { margin:0; font-size:18px; }
  .tile p { margin:0; color:var(--muted); }
  .tile .role { font-size:12px; color:var(--muted); }
  .tile button { align-self:flex-start; margin-top:6px; }
  .tile.off { opacity:.55; }
  .tabs { display:flex; gap:6px; margin:0 0 16px; border-bottom:1px solid var(--line); }
  .tabs button { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; padding:10px 12px; color:var(--muted); }
  .tabs button.on { color:var(--text); border-bottom-color:var(--brand); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:#eef2ff; color:#3730a3; margin-right:4px; }
  .pill.super_admin { background:#fef3c7; color:#92400e; }
  .pill.admin { background:#dbeafe; color:#1e40af; }
  .pill.user { background:#ecfdf5; color:#065f46; }
  .pill.warn { background:#fff7ed; color:var(--warn); }
  .muted { color:var(--muted); }
  .err { color:var(--bad); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input[type=text], input[type=email], select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
  dialog { border:1px solid var(--line); border-radius:14px; padding:22px; width:min(460px,92vw); }
  dialog label { display:block; margin:10px 0 4px; font-weight:600; font-size:13px; }
  dialog input[type=text], dialog input[type=email], dialog select { width:100%; }
  .stat { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:10px 0; }
  .stat div { background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:10px; }
  .stat b { display:block; font-size:20px; }
  main { max-width:1240px; }
  .badge:not(:empty) { display:inline-block; margin-left:6px; min-width:18px; padding:0 6px; border-radius:999px; background:var(--bad); color:#fff; font-size:11px; line-height:18px; text-align:center; }
  .quick { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .quick .sp { flex:1; }
  .alerts { background:#fff7ed; border:1px solid #fed7aa; border-radius:12px; padding:10px 14px; margin-bottom:14px; color:#7c2d12; }
  .alerts div + div { margin-top:4px; }
  .alerts a, .card a { color:var(--brand); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; }
  .kpi b { font-size:26px; line-height:1.1; font-weight:650; font-variant-numeric:tabular-nums; }
  .kpi span { font-size:13px; margin-top:4px; }
  .kpi small { color:var(--muted); font-size:12px; margin-top:2px; }
  .kpi.warn { border-color:#fdba74; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:16px; }
  .grid3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
  .grid2 > .card, .grid3 > .card { margin-bottom:0; } .grid2, .grid3 { margin-bottom:16px; }
  .ch { display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .ch .muted { font-size:12px; }
  table.compact th, table.compact td { padding:6px 6px; font-size:13px; }
  .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .nowrap { white-space:nowrap; }
  .wrap { word-break:break-all; }
  .scroll { max-height:340px; overflow:auto; }
  .scroll.tall { max-height:560px; }
  .st { font-size:12px; padding:1px 7px; border-radius:999px; background:#f1f5f9; }
  .st-completed { background:#ecfdf5; color:#065f46; } .st-cancelled { background:#fef2f2; color:#991b1b; } .st-rescheduled { background:#fff7ed; color:#9a3412; } .st-scheduled { background:#eff6ff; color:#1e40af; }
  .mini { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mini div { background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:12px; color:var(--muted); }
  .mini b { display:block; font-size:18px; color:var(--text); font-variant-numeric:tabular-nums; }
  .meter { width:40%; } .meter span { display:block; height:8px; border-radius:0 4px 4px 0; background:var(--brand); min-width:2px; }
  svg.bars { width:100%; height:auto; max-height:150px; }
  svg.bars .bar { fill:var(--brand); } svg.bars g:hover .bar { fill:var(--brand2); }
  svg.bars text { font-size:10px; fill:var(--muted); } svg.bars .axis { stroke:var(--line); stroke-width:1; }
  .ok { color:var(--ok); }
  .drop { display:block; border:2px dashed var(--line); border-radius:12px; padding:26px; text-align:center; color:var(--muted); cursor:pointer; margin:12px 0; }
  .drop.on { border-color:var(--brand); background:#eff6ff; }
  .steps { margin:8px 0; padding-left:20px; }
  details { border-top:1px solid var(--line); padding:8px 0; } details summary { cursor:pointer; }
  code { font-size:12px; background:#f1f5f9; padding:1px 5px; border-radius:5px; }
  pre { white-space:pre-wrap; background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:10px; font-size:12px; max-height:240px; overflow:auto; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/api/config"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";
  var $root = document.getElementById("root");
  var SB, ME = null, TAB = "", GEN = 0;
  // a response that arrives after the person moved to another tab is dropped
  function guard(fn) { var g = GEN; return function (x) { if (g === GEN) return fn(x); }; }
  var PORTALS = {
    ttop: { name: "TTOP Portal", desc: "Technical Team Operational Portal: candidates, interviews, assessments, closers and incentives.", url: "/ttop/" },
    callpilots: { name: "Call Pilots Operations Portal", desc: "Interview calls for the Pradeep Anna Team and the Hyderabad team: my calls, incentives, adding and assigning interviews.", url: "/callpilots/" }
  };
  var ROLE_LABEL = { super_admin: "Super admin", admin: "Admin", user: "User" };
  // what a person may open: TTOP, and Call Pilots per team (stored as portals + cp_teams)
  var ACCESS = [["ttop", "TTOP"], ["cp:Pradeep Anna", "Call Pilots · Pradeep Anna Team"], ["cp:HYD", "Call Pilots · HYD Team"]];
  var accessLabel = function (k) { var a = ACCESS.filter(function (x) { return x[0] === k; })[0]; return a ? a[1] : k; };
  var accessOf = function (u) { return u.access || (u.portals || []).filter(function (p) { return p === "ttop"; }); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };

  function api(path, body, method) {
    return fetch("/app/api/" + path, { method: method || (body ? "POST" : "GET"), headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin" })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || j.ok === false) { var e = new Error(j.error || ("Request failed (" + r.status + ")")); e.status = r.status; throw e; } return j; }); });
  }

  function showLogin(msg) {
    $root.innerHTML = '<div class="center"><div class="login"><h1>Interview Operations Portal</h1><p>TTOP and Call Pilots portals in one place.</p>' +
      (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
      '<button class="primary gbtn" id="g">Sign in with Google</button></div></div>';
    document.getElementById("g").onclick = function () {
      try { sessionStorage.setItem("iop_next", nextTarget() || ""); } catch (e) {}
      SB.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + "/" } });
    };
  }
  function showMessage(title, text, withSignOut) {
    $root.innerHTML = '<div class="center"><div class="login"><h1>' + esc(title) + '</h1><p>' + esc(text) + '</p>' + (withSignOut ? '<button id="so">Sign out</button>' : '') + '</div></div>';
    if (withSignOut) document.getElementById("so").onclick = signOut;
  }

  // Where the person wanted to go: ?next=/callpilots/ (sent by the server) or a TTOP alert link (/#i123).
  // Old ?next=/dhruva/ and /call-pilots/ links go to /callpilots/.
  function nextTarget() {
    var q = new URLSearchParams(location.search).get("next");
    if (q && /^\/(dhruva|call-pilots)\//.test(q)) q = "/callpilots/" + q.replace(/^\/(dhruva|call-pilots)\//, "");
    if (q && /^\/(ttop|callpilots)\//.test(q)) return q;
    var h = location.hash;
    if (h && h.length > 1 && !/access_token|error=/.test(h)) return "/ttop/" + h;
    return "";
  }

  function boot() {
    var c = window.TTOP_CONFIG || {};
    if (!c.url || !c.anon) return showMessage("Not configured", "Set SUPABASE_URL and SUPABASE_ANON_KEY on the server.");
    SB = supabase.createClient(c.url, c.anon);
    if (new URLSearchParams(location.search).get("signout") === "1") return signOut();
    SB.auth.getSession().then(function (r) {
      var session = r.data && r.data.session;
      if (!session) return showLogin();
      return api("login", { access_token: session.access_token }).then(function (j) {
        ME = j.user;
        if (history.replaceState && /access_token/.test(location.hash)) history.replaceState(null, "", "/" + location.search);
        var next = nextTarget();
        try { next = next || sessionStorage.getItem("iop_next") || ""; sessionStorage.removeItem("iop_next"); } catch (e) {}
        var allowed = j.user.portals;
        if (next) { var p = next.split("/")[1]; if (allowed.indexOf(p) >= 0) return openPortal(p, next); }
        if (allowed.length === 1 && j.user.role === "user") return openPortal(allowed[0]);
        render();
      }).catch(function (e) {
        if (e.status === 403) return showMessage("No access yet", (session.user && session.user.email ? session.user.email + " is" : "You are") + " signed in but not set up in the portal. Ask a super admin to add you.", true);
        showLogin(e.message);
      });
    });
  }

  function signOut() {
    api("logout", {}).catch(function () {}).then(function () {
      try { localStorage.removeItem("interview_portal_session"); sessionStorage.removeItem("interview_portal_session"); } catch (e) {}
      return SB.auth.signOut();
    }).then(function () { location.href = "/"; });
  }

  function openPortal(p, url) {
    location.href = url || PORTALS[p].url;
  }

  function render() {
    var canManage = ME.role === "super_admin" || ME.role === "admin";
    var tabs = ME.role === "super_admin"
      ? [["dash", "Dashboard"], ["people", "People"]]
      : canManage ? [["home", "Portals"], ["people", "People"]] : [];
    GEN++;
    if (!tabs.some(function (t) { return t[0] === TAB; })) TAB = tabs.length ? tabs[0][0] : "home";
    var h = '<header><h1>Interview Operations Portal</h1><span class="sp"></span><span class="who">' + esc(ME.email) + ' · ' + ROLE_LABEL[ME.role] + '</span><button id="so">Sign out</button></header><main>';
    if (tabs.length) h += '<div class="tabs">' + tabs.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (TAB === t[0] ? "on" : "") + '">' + t[1] + '<span class="badge" id="b_' + t[0] + '"></span></button>'; }).join("") + '</div>';
    h += '<div id="tab"></div></main>';
    $root.innerHTML = h;
    document.getElementById("so").onclick = signOut;
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) { b.onclick = function () { TAB = b.dataset.t; render(); }; });
    if (canManage) api("signups").then(function (j) { var b = document.getElementById("b_people"); if (b && j.signups.length) b.textContent = j.signups.length; }).catch(function () {});
    ({ dash: renderDash, people: renderAccess }[TAB] || renderHome)();
  }
  function tabEl() { return document.getElementById("tab"); }
  function loading() { tabEl().innerHTML = '<div class="card"><p class="muted">Loading…</p></div>'; }
  function fail(e) { tabEl().innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; }
  function bindOpen(root) {
    Array.prototype.forEach.call((root || document).querySelectorAll("[data-p]"), function (b) { b.onclick = function () { b.disabled = true; b.textContent = "Opening…"; openPortal(b.dataset.p, b.dataset.url); }; });
  }
  var nf = function (n) { return Number(n || 0).toLocaleString("en-IN"); };
  var rs = function (n) { return "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 }); };
  var when = function (t) {
    if (!t) return "—";
    var d = new Date(t), s = (Date.now() - d) / 1000;
    if (s < 60) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " h ago";
    if (s < 7 * 86400) return Math.round(s / 86400) + " d ago"; return d.toLocaleDateString();
  };

  function renderHome() {
    var t = '<div class="tiles">';
    Object.keys(PORTALS).forEach(function (k) {
      var ok = ME.portals.indexOf(k) >= 0, P = PORTALS[k];
      if (k === "callpilots" && ok && ME.role !== "super_admin") P = Object.assign({}, P, { desc: P.desc + " Your team: " + ((ME.cpTeams || []).join(", ") || "none yet") + "." });
      t += '<div class="tile' + (ok ? "" : " off") + '"><h2>' + P.name + '</h2><p>' + P.desc + '</p>' +
        (ok ? '<span class="role">You: ' + ROLE_LABEL[ME.role] + '</span><button class="primary" data-p="' + k + '">Open ' + P.name + '</button>' : '<span class="role">No access</span>') + '</div>';
    });
    t += '</div><p class="muted">Both portals use the same candidates, clients, interviews and incentives.</p>';
    tabEl().innerHTML = t;
    bindOpen();
  }

  /* ---------------- Dashboard (super admin) ---------------- */
  function kpi(v, label, sub, tone) { return '<div class="kpi' + (tone ? " " + tone : "") + '"><b>' + v + '</b><span>' + label + '</span>' + (sub ? '<small>' + sub + '</small>' : '') + '</div>'; }
  function bars(days) {
    if (!days || !days.length) return '';
    var max = Math.max.apply(null, days.map(function (d) { return d.n; }).concat([1])), W = 28, H = 90, gap = 2;
    var svg = '<svg class="bars" viewBox="0 0 ' + (days.length * (W + gap)) + ' ' + (H + 18) + '" role="img" aria-label="TTOP interviews per day, last 14 days">';
    days.forEach(function (d, i) {
      var h = Math.max(d.n ? 3 : 0, Math.round(d.n / max * H)), x = i * (W + gap) + 6, w = W - 12, y = H - h;
      var label = new Date(d.day + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) + ": " + d.n + " interview" + (d.n === 1 ? "" : "s");
      svg += '<g><title>' + esc(label) + '</title><rect x="' + (i * (W + gap)) + '" y="0" width="' + W + '" height="' + (H + 18) + '" fill="transparent"/>' +
        (h ? '<path d="M' + x + ' ' + H + 'V' + (y + 4) + 'q0 -4 4 -4h' + (w - 8) + 'q4 0 4 4V' + H + 'z" class="bar"/>' : '') +
        (i % 2 === (days.length - 1) % 2 ? '<text x="' + (i * (W + gap) + W / 2) + '" y="' + (H + 14) + '" text-anchor="middle">' + Number(d.day.slice(8)) + '</text>' : '') + '</g>';
    });
    return svg + '<line x1="0" x2="' + (days.length * (W + gap)) + '" y1="' + H + '" y2="' + H + '" class="axis"/></svg>';
  }
  function handlerTable(list) {
    if (!list || !list.length) return '<p class="muted">Nothing this month yet.</p>';
    var max = Math.max.apply(null, list.map(function (x) { return x.amount; }).concat([1]));
    return '<table class="compact"><tbody>' + list.map(function (x) {
      return '<tr><td>' + esc(x.handler) + '</td><td class="meter"><span style="width:' + Math.round(x.amount / max * 100) + '%"></span></td><td class="num">' + rs(x.amount) + '</td><td class="muted num">' + x.promotions + 'P · ' + x.selections + 'S</td></tr>';
    }).join("") + '</tbody></table>';
  }
  function sum(o) { return Object.keys(o || {}).reduce(function (a, k) { return a + (o[k] || 0); }, 0); }

  function renderDash() {
    loading();
    api("overview").then(guard(function (j) {
      var T = j.ttop || {}, C = T.counts || {}, U = j.users || {}, P = j.callpilots || { teams: [], activity: [] };
      var teams = P.teams || [];
      var tsum = function (f) { return teams.reduce(function (a, t) { return a + (f(t) || 0); }, 0); };
      var cpToday = tsum(function (t) { return t.calls.total; }), cpDone = tsum(function (t) { return (t.calls.byStatus || {}).Completed; });
      var cpResched = tsum(function (t) { return t.calls.rescheduleRequests; }), cpStale = tsum(function (t) { return t.calls.notUpdated; });
      var cpAmt = tsum(function (t) { return Number(t.incentives.monthAmount); });
      var alerts = [];
      if (U.pending) alerts.push(U.pending + ' person' + (U.pending === 1 ? " is" : "s are") + ' waiting for access. <a href="#" data-go="people">Review</a>.');
      if (j.ttopError) alerts.push('TTOP figures unavailable: ' + esc(j.ttopError) + ' (run migration 6).');
      if (j.callpilotsError) alerts.push('Call Pilots figures unavailable: ' + esc(j.callpilotsError) + ' (run migration 20261125000001_callpilots.sql).');
      else if (!teams.length) alerts.push('No Call Pilots handlers yet. Mark team members as Call Pilots handlers (cp_set_member).');
      if (P.unmatchedToolDrive) alerts.push(P.unmatchedToolDrive + ' Tool Drive name' + (P.unmatchedToolDrive === 1 ? "" : "s") + ' in the last 60 days could not be matched to one person (two people share a first name, or the name is unknown).');
      if (T.last_sync && !T.last_sync.ok) alerts.push('Last TTOP doc sync failed ' + when(T.last_sync.ran_at) + ': ' + esc(T.last_sync.error || T.last_sync.message || "") + '.');

      var h = '<div class="quick"><button class="primary" data-p="ttop">Open TTOP</button><button class="primary" data-p="callpilots">Open Call Pilots</button>' +
        '<span class="sp"></span><span class="muted">' + esc(new Date(j.generatedAt).toLocaleString(undefined, { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" })) + '</span><button id="refresh">Refresh</button></div>';
      if (alerts.length) h += '<div class="alerts">' + alerts.map(function (a) { return '<div>' + a + '</div>'; }).join("") + '</div>';

      h += '<div class="kpis">' +
        kpi(nf(C.today), "TTOP interviews today", nf(C.today_done) + " completed") +
        kpi(nf(cpToday), "Call Pilots calls today", nf(cpDone) + " completed · " + teams.map(function (t) { return esc(t.team) + " " + nf(t.calls.total); }).join(" · ")) +
        kpi(nf(cpResched + cpStale + (C.import_review || 0)), "Waiting for action", nf(cpResched) + " reschedule requests · " + nf(cpStale) + " calls not updated · TTOP import " + nf(C.import_review || 0), cpResched + cpStale + (C.import_review || 0) ? "warn" : "") +
        kpi(rs(C.incentive_month_amt || 0), "Incentives this month", "Call Pilots handlers " + rs(cpAmt) + " (part of the TTOP total)") +
        kpi(nf(C.placed_month), "Placed this month", nf(C.closers_month || 0) + " closers · " + nf(C.expected_open || 0) + " expected") +
        kpi(nf(U.total), "People with access", nf(U.activeWeek) + " signed in this week") + '</div>';

      // Today
      var tt = (T.today || []);
      h += '<div class="grid2"><div class="card"><div class="ch"><b>TTOP — today</b><span class="muted">' + nf(C.next7) + ' scheduled next 7 days · ' + nf(C.prep_pending) + ' need prep (next 3 days)</span></div>' +
        (tt.length ? '<div class="scroll"><table class="compact"><thead><tr><th>Time</th><th>Candidate · Client</th><th>Round</th><th>Status</th></tr></thead><tbody>' + tt.map(function (i) {
          return '<tr><td class="num">' + esc(i.time) + '</td><td><b>' + esc(i.candidate) + '</b><div class="muted">' + esc(i.client) + (i.support ? ' · ' + esc(i.support) : '') + '</div></td><td>' + esc(i.round) + '<div class="muted">' + esc(i.type) + '</div></td><td><span class="st st-' + esc(String(i.status).toLowerCase()) + '">' + esc(i.status) + '</span>' + (i.prep !== "Done" && i.status === "Scheduled" ? '<div class="muted">prep ' + esc(i.prep) + '</div>' : '') + '</td></tr>';
        }).join("") + '</tbody></table></div>' : '<p class="muted">No interviews today.</p>') +
        '<div class="ch" style="margin-top:14px"><b>Interviews per day</b><span class="muted">last 14 days</span></div>' + bars(T.by_day) + '</div>';

      var allCalls = teams.map(function (t) {
        return (t.calls.today || []).map(function (x) {
          return '<tr><td>' + esc(t.team) + '</td><td class="num">' + esc(x.time || "") + '</td><td><b>' + esc(x.candidate) + '</b><div class="muted">' + esc(x.client) + ' · ' + esc(x.round) + '</div></td><td>' + esc(x.handler) + '</td><td><span class="st st-' + esc(String(x.status).toLowerCase()) + '">' + esc(x.status) + '</span></td></tr>';
        }).join("");
      }).join("");
      h += '<div class="card"><div class="ch"><b>Call Pilots — today\'s calls</b><span class="muted">' + ["Completed", "Scheduled", "Cancelled"].map(function (s) { return s + " " + tsum(function (t) { return (t.calls.byStatus || {})[s]; }); }).join(" · ") + '</span></div>' +
        (allCalls ? '<div class="scroll"><table class="compact"><thead><tr><th>Team</th><th>Time</th><th>Call</th><th>Handler</th><th>Status</th></tr></thead><tbody>' + allCalls + '</tbody></table></div>' : '<p class="muted">No calls on today\'s list.</p>') +
        '<div class="ch" style="margin-top:14px"><b>Needs action in Call Pilots</b></div><table class="compact"><thead><tr><th></th>' + teams.map(function (t) { return '<th class="num">' + esc(t.team) + '</th>'; }).join("") + '</tr></thead><tbody>' +
        '<tr><td>Reschedule requests</td>' + teams.map(function (t) { return '<td class="num">' + nf(t.calls.rescheduleRequests) + '</td>'; }).join("") + '</tr>' +
        '<tr><td>Past calls not updated (30 days)</td>' + teams.map(function (t) { return '<td class="num">' + nf(t.calls.notUpdated) + '</td>'; }).join("") + '</tr>' +
        '</tbody></table></div></div>';

      // Incentives
      h += '<div class="grid3"><div class="card"><div class="ch"><b>TTOP incentives</b></div><div class="mini">' +
        '<div><b>' + rs(C.incentive_month_amt) + '</b>this month</div><div><b>' + rs(C.incentive_pending_amt) + '</b>pending (' + nf(C.incentive_pending) + ')</div><div><b>' + nf(C.candidates) + '</b>active candidates</div><div><b>' + nf(C.clients) + '</b>clients</div></div></div>' +
        teams.map(function (t) {
          return '<div class="card"><div class="ch"><b>Call Pilots ' + esc(t.team) + ' — this month</b><span class="muted">' + rs(t.incentives.monthAmount) + ' · ' + nf(t.incentives.monthCount) + ' entries · ' + nf(t.handlers) + ' handlers</span></div>' + handlerTable(t.incentives.byHandler) + '</div>';
        }).join("") + '</div>';

      // Activity
      var act = (T.activity || []).map(function (a) { return { at: a.at, src: "TTOP", who: a.who, what: a.action + (a.entity ? " · " + a.entity : "") }; })
        .concat((P.activity || []).map(function (a) { return { at: a.at, src: "Call Pilots", who: a.who, what: a.action }; }))
        .sort(function (a, b) { return new Date(b.at) - new Date(a.at); }).slice(0, 15);
      h += '<div class="grid2"><div class="card"><div class="ch"><b>Recent activity</b><span class="muted">both portals</span></div>' + (act.length ? '<table class="compact"><tbody>' + act.map(function (a) {
        return '<tr><td class="muted nowrap">' + when(a.at) + '</td><td><span class="pill">' + esc(a.src) + '</span></td><td>' + esc(a.what).slice(0, 160) + '<div class="muted">' + esc(a.who || "") + '</div></td></tr>';
      }).join("") + '</tbody></table>' : '<p class="muted">No activity yet.</p>') + '</div>';
      h += '<div class="card"><div class="ch"><b>System</b></div><table class="compact"><tbody>' +
        '<tr><td>People</td><td>' + nf(U.superAdmins) + ' super admins · ' + nf(U.admins) + ' admins · ' + nf(U.users) + ' users</td></tr>' +
        '<tr><td>Call Pilots handlers</td><td>' + (teams.length ? teams.map(function (t) { return esc(t.team) + " " + nf(t.handlers); }).join(" · ") : '<span class="muted">none yet</span>') + '</td></tr>' +
        '<tr><td>TTOP doc sync</td><td>' + (T.last_sync ? (T.last_sync.ok ? "OK " : '<span class="err">Failed</span> ') + when(T.last_sync.ran_at) + ' · ' + nf(T.last_sync.added) + ' added, ' + nf(T.last_sync.updated) + ' updated' : '<span class="muted">no runs yet</span>') + '</td></tr>' +
        '</tbody></table></div></div>';

      tabEl().innerHTML = h;
      bindOpen(tabEl());
      document.getElementById("refresh").onclick = renderDash;
      Array.prototype.forEach.call(tabEl().querySelectorAll("[data-go]"), function (a) { a.onclick = function (e) { e.preventDefault(); TAB = a.dataset.go; render(); }; });
    })).catch(guard(fail));
  }

  /* ---------------- People ---------------- */
  function renderAccess() {
    loading();
    Promise.all([api("users"), api("signups").catch(function () { return { signups: [] }; })]).then(guard(function (r) {
      var j = r[0], sign = r[1].signups, Q = "";
      var draw = function () {
        var q = Q.toLowerCase();
        var list = j.users.filter(function (u) { return !q || (u.email + " " + (u.name || "") + " " + u.role + " " + accessOf(u).map(accessLabel).join(" ")).toLowerCase().indexOf(q) >= 0; });
        document.getElementById("ulist").innerHTML = list.map(function (u) {
          return '<tr><td><b>' + esc(u.name || "") + '</b><div class="muted">' + esc(u.email) + '</div></td>' +
            '<td><span class="pill ' + u.role + '">' + ROLE_LABEL[u.role] + '</span>' + (u.active ? "" : ' <span class="pill warn">blocked</span>') + '</td>' +
            '<td>' + (accessOf(u).length ? accessOf(u).map(function (k) { return '<span class="pill">' + esc(accessLabel(k)) + '</span>'; }).join(" ") : '<span class="muted">none</span>') +
              (u.role !== "super_admin" && (u.portals || []).indexOf("callpilots") >= 0 && !(u.cpTeams || []).length ? ' <span class="pill warn" title="Edit and tick a Call Pilots team">Call Pilots: no team</span>' : '') + '</td>' +
            '<td class="muted nowrap">' + when(u.lastLogin) + '</td>' +
            '<td>' + (u.canEdit ? '<button data-e="' + esc(u.email) + '">Edit</button>' : '') + '</td></tr>';
        }).join("") || '<tr><td colspan="5" class="muted">No match.</td></tr>';
        Array.prototype.forEach.call(tabEl().querySelectorAll("[data-e]"), function (b) { b.onclick = function () { editUser(j.users.find(function (u) { return u.email === b.dataset.e; })); }; });
      };
      var roles = { super_admin: 0, admin: 0, user: 0 }, blocked = 0;
      j.users.forEach(function (u) { if (u.active) roles[u.role]++; else blocked++; });
      var h = '';
      if (sign.length) h += '<div class="card"><div class="ch"><b>Waiting for access</b><span class="muted">signed in with Google, not set up yet</span></div><table class="compact"><tbody>' + sign.map(function (s) {
        return '<tr><td><b>' + esc(s.name) + '</b><div class="muted">' + esc(s.email) + '</div></td><td class="muted">' + when(s.signed_up) + '</td><td style="text-align:right"><button class="primary" data-ok="' + esc(s.email) + '" data-n="' + esc(s.name) + '">Give access…</button> ' +
          (ME.role === "super_admin" ? '<button class="danger" data-no="' + esc(s.email) + '">Block</button>' : '') + '</td></tr>';
      }).join("") + '</tbody></table></div>';
      h += '<div class="card"><div class="row" style="justify-content:space-between"><div><b>People and access</b><div class="muted">' +
        (ME.role === "super_admin" ? "Super admins see everything. Admins and users see only the portal and Call Pilots team ticked for them." : "You can add and change users of your portal and team.") +
        ' TTOP access follows this list automatically. In Call Pilots, users see their own calls and incentives; admins see everyone and add and assign interviews.</div></div>' +
        '<button class="primary" id="add">Add person</button></div>' +
        '<div class="row" style="margin-top:12px"><input type="text" id="q" placeholder="Search name, email, role, portal" style="flex:1;min-width:220px"><span class="muted">' +
        roles.super_admin + ' super admins · ' + roles.admin + ' admins · ' + roles.user + ' users' + (blocked ? ' · ' + blocked + ' blocked' : '') + '</span></div>' +
        '<div class="scroll tall"><table style="margin-top:8px"><thead><tr><th>Person</th><th>Role</th><th>Portals</th><th>Last sign-in</th><th></th></tr></thead><tbody id="ulist"></tbody></table></div></div>';
      tabEl().innerHTML = h;
      draw();
      document.getElementById("q").oninput = function () { Q = this.value; draw(); };
      document.getElementById("add").onclick = function () { editUser(null); };
      Array.prototype.forEach.call(tabEl().querySelectorAll("[data-ok]"), function (b) { b.onclick = function () { editUser(null, { email: b.dataset.ok, name: b.dataset.n }); }; });
      Array.prototype.forEach.call(tabEl().querySelectorAll("[data-no]"), function (b) {
        b.onclick = function () {
          if (!confirm("Block " + b.dataset.no + "? They stay signed out of both portals and leave this list. You can give access later from People.")) return;
          api("users", { email: b.dataset.no, role: "user", access: [], active: false }).then(renderAccess).catch(function (e) { alert(e.message); });
        };
      });
    })).catch(guard(fail));
  }

  function editUser(u, prefill) {
    var isNew = !u;
    u = u || { email: (prefill && prefill.email) || "", name: (prefill && prefill.name) || "", role: "user", access: ME.role === "admin" && accessOf(ME).length === 1 ? accessOf(ME).slice() : [], active: true };
    var roles = ME.role === "super_admin" ? ["super_admin", "admin", "user"] : ["user"];
    var choices = ME.role === "super_admin" ? ACCESS.map(function (a) { return a[0]; }) : accessOf(ME), has = accessOf(u);
    var d = document.createElement("dialog");
    d.innerHTML = '<h3 style="margin-top:0">' + (isNew ? (prefill ? "Give access" : "Add person") : "Edit " + esc(u.email)) + '</h3>' +
      '<label>Email</label><input type="email" id="f_email" value="' + esc(u.email) + '"' + (isNew && !prefill ? "" : " disabled") + '>' +
      '<label>Name</label><input type="text" id="f_name" value="' + esc(u.name || "") + '">' +
      '<label>Role</label><select id="f_role">' + roles.map(function (r) { return '<option value="' + r + '"' + (r === u.role ? " selected" : "") + '>' + ROLE_LABEL[r] + '</option>'; }).join("") + '</select>' +
      '<label>Access</label><div id="f_portals">' + choices.map(function (k) { return '<label style="display:flex;gap:8px;font-weight:400;margin:6px 0"><input type="checkbox" value="' + esc(k) + '"' + (has.indexOf(k) >= 0 ? " checked" : "") + '>' + esc(accessLabel(k)) + '</label>'; }).join("") + '</div>' +
      '<label style="display:flex;gap:6px;font-weight:400;margin-top:12px"><input type="checkbox" id="f_active"' + (u.active ? " checked" : "") + '> Active (untick to block)</label>' +
      '<p class="muted" style="font-size:12px">Super admins see everything. An admin sees and manages only the portal and Call Pilots team(s) ticked here; a user sees only their own work. A Call Pilots team also makes the person a handler of that team.</p><p class="err" id="f_err"></p>' +
      '<div class="row" style="justify-content:space-between;margin-top:8px">' + (isNew ? "<span></span>" : '<button class="danger" id="f_del">Remove</button>') +
      '<div class="row"><button id="f_cancel">Cancel</button><button class="primary" id="f_save">Save</button></div></div>';
    document.body.appendChild(d); d.showModal();
    var close = function () { d.close(); d.remove(); };
    d.querySelector("#f_cancel").onclick = close;
    d.querySelector("#f_save").onclick = function () {
      var body = {
        email: d.querySelector("#f_email").value, name: d.querySelector("#f_name").value, role: d.querySelector("#f_role").value,
        access: Array.prototype.map.call(d.querySelectorAll("#f_portals input:checked"), function (x) { return x.value; }),
        active: d.querySelector("#f_active").checked
      };
      api("users", body).then(function () { close(); render(); }).catch(function (e) { d.querySelector("#f_err").textContent = e.message; });
    };
    var del = d.querySelector("#f_del");
    if (del) del.onclick = function () {
      if (!confirm("Remove " + u.email + " from the portal? They lose access to both portals.")) return;
      api("users?email=" + encodeURIComponent(u.email), null, "DELETE").then(function () { close(); render(); }).catch(function (e) { d.querySelector("#f_err").textContent = e.message; });
    };
  }

  boot();
})();
</script>
</body>
</html>
