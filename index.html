setInterval(()=>{const e=$('#cd');if(!e)return;const[h,m]=e.dataset.t.split(':'),d=new Date();d.setHours(h,m,0,0);if(h<6&&new Date().getHours()>=6)d.setDate(d.getDate()+1);const s=Math.max(0,Math.round((d-new Date())/1e3));e.textContent=pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)},1000);
let SB,busy=0,again=0;
const tid=n=>(team.find(t=>t.name==n)||{}).id||null,cidOf=n=>(C.find(c=>nm(c.name)==nm(n))||{}).id,dbid=x=>+String(x.id).replace(/\D/g,''),
cp=c=>({name:c.name,email:c.email||null,phone:c.phone||null,location:c.loc||null,experience:c.exp||null,assigned_domains:c.domains||null,technical_poc_id:tid(c.poc),marketing_poc:c.mkt||null,active:!!c.active}),
ip=i=>({candidate_id:cidOf(i.cand),role:i.role||null,client_id:CID[i.client],interview_date:i.date,interview_time:i.time,duration_minutes:parseInt(i.dur)||60,round:i.round,interview_type:i.type,source:i.source,assessment_id:i.assess?+i.assess.slice(1):null,tool_drive:i.td||null,call_support_1:tid(i.cs1),call_support_2:tid(i.cs2),prep_status:i.prep,notes:i.notes||null,interview_status:i.status,placement_status:i.placement=='—'?null:i.placement,rescheduled_from:i.prev||null}),

async function fetchAll(t,f){let out=[],from=0;for(;;){const b=SB.from(t).select('*'),r=await (f?f(b):b).range(from,from+999);if(r.error)throw r.error;out=out.concat(r.data);if(r.data.length<1000)return out;from+=1000}}
async function loadInc(){const ic=await fetchAll('incentives'),cm=new Map(C.map(c=>[c.id,c.name])),clm=new Map(Object.entries(CID).map(([n,id])=>[id,n]));INC.length=0;ic.forEach(x=>INC.push({key:x.id,cand:cm.get(x.candidate_id)||'—',client:clm.get(x.client_id)||'—',round:x.round_label,type:x.incentive_type,who:x.recipient_name,amt:+x.amount,status:x.status,date:x.event_date}))}
async function loadAll(){const ad=isA(),[tm_,cl,ca,iv,as,lg,pr,al]=await Promise.all([fetchAll('team_members'),fetchAll('clients'),fetchAll('candidates'),fetchAll('interviews'),fetchAll('assessments'),ad?fetchAll('activity_log',b=>b.order('at',{ascending:false})):[],ad?fetchAll('profiles'):[],ad?[]:fetchAll('interview_records_all',b=>b.eq('is_mine',false).order('sort_key',{ascending:false}))]);
team.length=0;tm_.forEach(t=>team.push({id:t.id,name:t.name,email:t.email,poc:+t.is_technical_poc,td:+t.is_tool_drive,cs:+t.is_call_support,db:1}));
clients.length=0;CID={};cl.forEach(c=>{clients.push(c.name);CID[c.name]=c.id});
const tn=id=>(team.find(t=>t.id==id)||{}).name||'',cm=new Map(ca.map(c=>[c.id,c.name])),clm=new Map(cl.map(c=>[c.id,c.name]));
C=ca.map(c=>({id:c.id,name:c.name,email:c.email||'',phone:c.phone||'',loc:c.location||'',exp:c.experience||'',domains:c.assigned_domains||'',poc:tn(c.technical_poc_id),mkt:c.marketing_poc||'',assigned:'',active:c.active,db:1}));
I.length=0;iv.forEach(x=>I.push({id:x.id,cand:cm.get(x.candidate_id),role:x.role||'',client:clm.get(x.client_id),date:x.interview_date,time:x.interview_time.slice(0,5),dur:x.duration_minutes+' Minutes',round:x.round,type:x.interview_type,source:x.source,assess:x.assessment_id?'A'+x.assessment_id:'',td:x.tool_drive||'',cs1:tn(x.call_support_1),cs2:tn(x.call_support_2),prep:x.prep_status,status:x.interview_status,placement:x.placement_status||'—',prev:x.rescheduled_from||'',notes:x.notes||'',db:1}));
A=as.map(a=>({id:'A'+a.id,cand:cm.get(a.candidate_id),type:a.type,tech:a.tech_role,client:a.client_id?clm.get(a.client_id):'',status:a.status,date:a.assessment_date,files:(a.files||[]).map(f=>f.name),poc:(C.find(c=>c.id==a.candidate_id)||{}).poc||'',db:1}));
OT.length=0;al.forEach(r=>OT.push({id:-r.id,cand:r.candidate,role:r.role||'',client:r.client,date:r.interview_date,time:r.interview_time.slice(0,5),dur:r.duration_minutes+' Minutes',round:r.round,type:r.interview_type,status:r.interview_status,pocName:r.technical_poc||'',td:'',cs1:'',cs2:'',prep:'',source:'',assess:'',placement:'—',prev:'',notes:''}));
log=lg.map(l=>({t:new Date(l.at).toLocaleString(),who:l.actor_name||l.actor_email||'',a:l.action,db:1}));
users.length=0;pr.forEach(p=>users.push({email:p.email,name:p.name||p.email,role:p.role=='admin'?'Admin':'User',ok:p.approved,ok0:p.approved,db:1}));
await loadInc();SNAP={c:{},a:{},i:{},t:{}};team.forEach(t=>SNAP.t[t.id]=JSON.stringify(tp(t)));C.forEach(c=>SNAP.c[c.id]=JSON.stringify(cp(c)));A.forEach(a=>SNAP.a[a.id]=JSON.stringify(ap_(a)));I.forEach(i=>SNAP.i[i.id]=JSON.stringify(ip(i)));sy='✓ Saved to database'}
// Write-through: the UI edits memory, then persist() sends only what changed. A failed save is retried.
async function sync(arr,tb,mp,sn,remap,fid){for(const x of arr){const p=mp(x);if(('candidate_id' in p&&p.candidate_id==null)||(tb=='interviews'&&!p.client_id))continue;
if(!x.db){const r=await SB.from(tb).insert(p).select('id').single();if(r.error)throw r.error;const o=x.id;x.id=fid?fid(r.data.id):r.data.id;x.db=1;sn[x.id]=JSON.stringify(p);if(remap)remap(o,x.id)}
else if(sn[x.id]!==JSON.stringify(p)){const r=await SB.from(tb).update(p).eq('id',dbid(x));if(r.error)throw r.error;sn[x.id]=JSON.stringify(p)}}
if(tb=='candidates')for(const id of Object.keys(sn))if(!arr.some(x=>x.id==id)){const r=await SB.from(tb).delete().eq('id',+id);if(r.error)throw r.error;delete sn[id]}}
async function persist(){if(busy){again=1;return}busy=1;sy='↻ Saving…';upd_sy();
try{do{again=0;
for(const n of clients)if(!CID[n]){const r=await SB.from('clients').insert({name:n}).select().single();if(r.error)throw r.error;CID[n]=r.data.id}
for(const t of team.filter(t=>!t.db)){const r=await SB.from('team_members').insert({name:t.name,email:t.email,is_technical_poc:!!t.poc,is_tool_drive:!!t.td,is_call_support:!!t.cs}).select().single();if(r.error)throw r.error;t.id=r.data.id;t.db=1;SNAP.t[t.id]=JSON.stringify(tp(t))}
for(const t of team.filter(t=>t.db)){const q=tp(t);if(SNAP.t[t.id]!==JSON.stringify(q)){const r=await SB.from('team_members').update(q).eq('id',t.id);if(r.error)throw r.error;SNAP.t[t.id]=JSON.stringify(q)}}
await sync(C,'candidates',cp,SNAP.c);
await sync(A,'assessments',ap_,SNAP.a,(o,n)=>I.forEach(i=>{if(i.assess==o)i.assess=n}),n=>'A'+n);
await sync(I,'interviews',ip,SNAP.i,(o,n)=>I.forEach(i=>{if(i.prev==o)i.prev=n}));
for(const l of log.filter(l=>!l.db)){const r=await SB.from('activity_log').insert({actor_email:me.email,actor_name:me.name,action:l.a});if(r.error)throw r.error;l.db=1}
for(const u of users.filter(u=>u.db&&u.ok&&!u.ok0)){const r=await SB.from('profiles').update({approved:true}).eq('email',u.email);if(r.error)throw r.error;u.ok0=1}
}while(again);await loadInc();sy='✓ Saved to database';if(cur=='inc'||cur=='team')render()}
catch(e){sy='⚠ Not saved yet: '+e.message+' (retrying)';setTimeout(persist,15000)}
busy=0;upd_sy()}
function login(msg){$('#app').innerHTML=`<div class="lg"><div class="card"><h2>TTOP Portal</h2><p class="mu">Sign in with your Google account. New users wait for admin approval.</p><button class="p blk" onclick="gsi()">Sign in with Google</button>${msg?`<p class="er">${msg}</p>`:''}</div></div>`}
const gsi=()=>SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}});
P.set=()=>`<h2>Settings</h2><div class="card"><p>Signed in as <b>${me.email}</b> (${me.role}).</p><p>Database: <span class="pill Completed">Supabase connected</span></p><p class="mu">Google Sheet sync and Drive folders need a server job. They are not set up in this version.</p></div>`;
const tp=t=>({name:t.name,email:t.email,is_technical_poc:!!t.poc,is_tool_drive:!!t.td,is_call_support:!!t.cs}),
tf=()=>{const u=users.find(u=>u.email==$('#te').value);if(u&&!$('#tn').value)$('#tn').value=u.name},
ta=()=>{const n=$('#tn').value.trim(),e=$('#te').value.trim().toLowerCase();if(!n||!e)return toast('Name and email are required');if(team.some(t=>t.email.toLowerCase()==e))return toast('That email is already on the team');

const ed=(t,k)=>`<input value="${t[k].replace(/"/g,'&quot;')}" size="${k=='email'?34:16}" onchange="tmu(${t.id},'${k}',this.value)">`,
tmu=(id,k,v)=>{const t=team.find(x=>x.id==id);v=v.trim();if(!v){toast('This cannot be empty');return render()}
if(k=='email'){v=v.toLowerCase();if(team.some(x=>x.id!=id&&x.email.toLowerCase()==v)){toast('That email is already on the team');return render()}}
if(k=='name'){const o=t.name;C.forEach(c=>{if(c.poc==o)c.poc=v});I.forEach(i=>{if(i.cs1==o)i.cs1=v;if(i.cs2==o)i.cs2=v});A.forEach(a=>{if(a.poc==o)a.poc=v})}
t[k]=v;L('Edited team member '+t.name);saved()},
tmd=id=>{const t=team.find(x=>x.id==id),n=C.filter(c=>c.poc==t.name).length;
if(n)return mdl(`<h3>Cannot delete ${t.name}</h3><p>${n} candidate${n>1?'s are':' is'} assigned to them as Technical POC. Reassign ${n>1?'them':'the candidate'} on the Candidates page first.</p><div class="row"><button onclick="cm_()">OK</button></div>`);
mdl(`<h3>Delete ${t.name}?</h3><p>${t.email} will no longer count as a team member. Their Google login and approval stay as they are.</p><div class="row"><button onclick="cm_()">Cancel</button><button class="d" onclick="tmd2(${id})">Delete</button></div>`)},

team.splice(team.indexOf(t),1);delete SNAP.t[id];L('Deleted team member '+t.name);cm_();saved();render()};
async function boot(){try{const c=window.TTOP_CONFIG||{};if(!c.url||!c.anon)return login('Supabase is not configured. Add the Supabase integration (or the two env vars) in Vercel and redeploy.');
SB=supabase.createClient(c.url,c.anon);const{data:{session}}=await SB.auth.getSession();if(!session)return login();

me={email:p.email,name:p.name||p.email,role:p.role=='admin'?'Admin':'User',ok:1};$('#app').innerHTML='<p style="padding:20px">Loading…</p>';await loadAll();go('dash')}catch(e){login('Error: '+e.message)}}
boot();
